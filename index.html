<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>Keuangan Keluarga</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #f0f2f5; }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Memuat aplikasi...</div>
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxAgeNizKMN3QMupYdYeNcsYywG36hdtAeVYXgK1gFLptvz3mkXJRA3OAu79ZcdkJ3H/exec"
    allow="clipboard-write"
  ></iframe>
  <script>
    // Sembunyikan loading setelah iframe dimuat
    document.getElementById('appFrame').addEventListener('load', function() {
      document.getElementById('loading').style.display = 'none';
    });
    
    // Register service worker untuk PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>

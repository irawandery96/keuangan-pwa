<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>Keuangan Keluarga</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* HALAMAN LOGIN PIN */
    #loginPage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      z-index: 100;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .login-box .icon {
      font-size: 50px;
      margin-bottom: 12px;
    }
    .login-box h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 6px;
    }
    .login-box p {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }
    #pinInput {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 8px;
      font-family: inherit;
      margin-bottom: 14px;
    }
    #pinInput:focus {
      outline: none;
      border-color: #667eea;
    }
    #loginBtn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #loginBtn:active { transform: scale(0.98); }
    #errorMsg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }
    .shake {
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    
    /* HALAMAN APLIKASI */
    #appPage {
      display: none;
      width: 100%;
      height: 100%;
    }
    #appPage iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <div id="loginPage">
    <div class="login-box" id="loginBox">
      <div class="icon">💰</div>
      <h1>Keuangan Keluarga</h1>
      <p>Masukkan PIN untuk melanjutkan</p>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="10" placeholder="••••">
      <button id="loginBtn" onclick="cekPin()">Masuk</button>
      <div id="errorMsg"></div>
    </div>
  </div>

  <!-- HALAMAN APLIKASI -->
  <div id="appPage">
    <div class="loading" id="loading">Memuat aplikasi...</div>
    <iframe 
      id="appFrame"
      src=""
      allow="clipboard-write"
    ></iframe>
  </div>

  <script>
    // ============================================
    // GANTI PIN DI SINI (ganti "1234" dengan PIN pilihan Anda)
    // ============================================
    const PIN_RAHASIA = "888888";
    
    // ============================================
    // GANTI URL DI SINI (URL Apps Script Anda)
    // ============================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxAgeNizKMN3QMupYdYeNcsYywG36hdtAeVYXgK1gFLptvz3mkXJRA3OAu79ZcdkJ3H/exec";
    
    // ============================================
    // JANGAN UBAH DI BAWAH INI
    // ============================================
    
    // ✅ PAKAI sessionStorage — PIN hilang saat app ditutup
    const STORAGE_KEY = 'keuangan_login';
    
    // Cek apakah sudah login sebelumnya (per sesi)
    window.addEventListener('DOMContentLoaded', function() {
      const sudahLogin = sessionStorage.getItem(STORAGE_KEY);
      if (sudahLogin === 'yes') {
        tampilkanAplikasi();
      }
      const pinInput = document.getElementById('pinInput');
      if (pinInput) pinInput.focus();
    });
    
    function cekPin() {
      const input = document.getElementById('pinInput').value;
      const errorEl = document.getElementById('errorMsg');
      const box = document.getElementById('loginBox');
      
      if (input === PIN_RAHASIA) {
        sessionStorage.setItem(STORAGE_KEY, 'yes');
        tampilkanAplikasi();
      } else {
        errorEl.textContent = '❌ PIN salah, coba lagi';
        box.classList.add('shake');
        setTimeout(() => box.classList.remove('shake'), 500);
        document.getElementById('pinInput').value = '';
      }
    }
    
    function tampilkanAplikasi() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('appPage').style.display = 'block';
      
      const frame = document.getElementById('appFrame');
      
      if (!frame.src || frame.src === '' || frame.src === window.location.href) {
        frame.src = URL_APPS_SCRIPT;
      }
      
      frame.addEventListener('load', function() {
        document.getElementById('loading').style.display = 'none';
      });
      
      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    }
    
    // Tekan Enter untuk login
    document.getElementById('pinInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') cekPin();
    });
    
    // ============================================
// FUNGSI LOGOUT
// ============================================
function lakukanLogout() {
  // Hapus sessionStorage
  sessionStorage.removeItem(STORAGE_KEY);
  
  // Tampilkan halaman login
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';
  
  // Reset form PIN
  var pinInput = document.getElementById('pinInput');
  if (pinInput) {
    pinInput.value = '';
    setTimeout(function() { pinInput.focus(); }, 100);
  }
  
  // Reset iframe src (biar state bersih)
  var frame = document.getElementById('appFrame');
  if (frame) frame.src = '';
  
  // Reset loading
  var loading = document.getElementById('loading');
  if (loading) loading.style.display = 'flex';
  
  // Kosongkan pesan error
  var errorEl = document.getElementById('errorMsg');
  if (errorEl) errorEl.textContent = '';
  
  // Hapus hash dari URL
  if (window.location.hash === '#logout') {
    history.replaceState(null, '', window.location.pathname);
  }
}

// Cara 1: Terima postMessage dari iframe
window.addEventListener('message', function(event) {
  if (event.data && event.data.action === 'logout') {
    lakukanLogout();
  }
});

// Cara 2: Pantau perubahan hash URL
function cekHashLogout() {
  if (window.location.hash === '#logout') {
    lakukanLogout();
  }
}
window.addEventListener('hashchange', cekHashLogout);
window.addEventListener('DOMContentLoaded', cekHashLogout);

// Cara 3: Cek hash setiap 500ms (fallback terakhir)
setInterval(function() {
  if (window.location.hash === '#logout') {
    lakukanLogout();
  }
}, 500);
  </script>
</body>
</html>
